name: CI Build

# 동적 서버 앱으로 전환됨 — 배포는 Vercel이 담당(레포 연결 시 자동 배포).
# 이 워크플로는 빌드가 깨지지 않는지 검증만 한다.
on:
  push:
    branches:
      - main
      - claude/epic-edison-m35tv3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
