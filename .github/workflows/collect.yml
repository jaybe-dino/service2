name: 수집 자동화 (collect)

# 15분마다 수집 엔드포인트를 호출해 끝난 run을 적재하고 다음 run을 시작한다.
# ⚠️ GitHub Actions의 schedule 트리거는 "기본 브랜치"에서만 동작합니다.
#    이 워크플로 파일이 기본 브랜치(예: main)에 머지되어 있어야 자동 실행됩니다.
#    리포지토리 Settings → Secrets → Actions 에 COLLECT_CRON_URL 를 등록하세요.
#    예: https://glovek.space/api/cron/collect?key=<CRON_SECRET 값>
on:
  # 자동 크롤링 중단 — 수집은 어드민 '지금 수집 실행'(수동) 또는 아래 수동 트리거로만.
  # (다시 자동화하려면 schedule 블록을 되살리고 COLLECT_CRON_URL 시크릿 등록)
  workflow_dispatch: {}        # 수동 실행만

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Ping collect endpoint
        run: |
          if [ -z "${{ secrets.COLLECT_CRON_URL }}" ]; then
            # 시크릿 미등록 시 실패가 아니라 '건너뜀'으로 종료(실패 알림 스팸 방지).
            echo "::warning::COLLECT_CRON_URL 시크릿 미등록 — 수집 건너뜀. Settings → Secrets에 등록하면 활성화됩니다."
            exit 0
          fi
          curl -fsS --max-time 70 "${{ secrets.COLLECT_CRON_URL }}" && echo "" && echo "OK"
