<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TikTok Shop 판매창 캡처 갤러리</title>
  <meta name="description" content="국가별 TikTok Shop 판매창의 실제 캡처와 확인 상태를 모아 봅니다." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <p class="eyebrow">TikTok Shop</p>
      <h1>판매창 캡처 갤러리</h1>
      <p class="lede">
        국가별 TikTok Shop의 <strong>실제 판매 화면</strong>을 모아 봅니다.
        저장된 캡처는 한국에서도 VPN 없이 확대해 확인하고 다운로드할 수 있습니다.
      </p>
      <p class="disclaimer">
        캡처 시점의 화면입니다. 이미지에 보이는 가격·판매량·재고는 현재 상태와 다를 수 있습니다.
        <b>원본 링크</b>는 국가에 따라 접근이 제한될 수 있습니다.
      </p>
    </div>
  </header>

  <section class="controls wrap" aria-label="검색 및 필터">
    <div class="search-box">
      <label for="search" class="sr-only">브랜드 검색</label>
      <input type="search" id="search" placeholder="브랜드 검색 (예: 로아띠, FAU)" autocomplete="off" />
    </div>
    <div class="filters" role="group" aria-label="국가 필터">
      <button type="button" class="filter is-active" data-country="all" aria-pressed="true">전체</button>
      <button type="button" class="filter" data-country="미국" aria-pressed="false">미국</button>
      <button type="button" class="filter" data-country="태국" aria-pressed="false">태국</button>
    </div>
  </section>

  <section class="summary wrap" aria-live="polite">
    <span class="count-chip" id="count-captured">완료 캡처 0</span>
    <span class="count-chip muted" id="count-total">표시 0 / 전체 0</span>
  </section>

  <main id="gallery" class="gallery wrap" aria-label="캡처 목록"></main>

  <p id="empty" class="empty wrap" hidden>조건에 맞는 브랜드가 없습니다.</p>

  <footer class="site-footer wrap">
    <p>DINO · TikTok Shop 판매 채널</p>
  </footer>

  <dialog id="viewer" class="viewer" aria-labelledby="viewer-title">
    <div class="viewer-head">
      <h2 id="viewer-title">캡처 보기</h2>
      <button type="button" id="viewer-close" class="viewer-close" aria-label="닫기">✕</button>
    </div>
    <div class="viewer-body">
      <img id="viewer-img" alt="" />
      <p id="viewer-missing" class="viewer-missing" hidden>캡처 이미지가 아직 없습니다 (확인 대기).</p>
    </div>
    <div class="viewer-foot">
      <span id="viewer-meta" class="viewer-meta"></span>
      <a id="viewer-download" class="btn btn-pink" download hidden>JPG 다운로드</a>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
